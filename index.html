<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abledsoul — Duane Marcel</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Orbitron', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'neon-cyan':    '#00f5ff',
              'neon-magenta': '#ff00ff',
              'neon-purple':  '#bf00ff',
              'neon-green':   '#00ff88',
              'dark-base':    '#050508',
              'dark-panel':   '#0a0a0f',
              'dark-card':    '#0f0f17',
              'dark-border':  '#1a1a2e',
              'steel':        '#4a5568',
              'ash':          '#718096',
            },
            animation: {
              'glow-pulse': 'glowPulse 3s ease-in-out infinite',
              'float':      'float 6s ease-in-out infinite',
              'scanline':   'scanline 8s linear infinite',
            },
            keyframes: {
              glowPulse: {
                '0%,100%': { opacity: '0.6' },
                '50%':     { opacity: '1'   },
              },
              float: {
                '0%,100%': { transform: 'translateY(0px)'    },
                '50%':     { transform: 'translateY(-20px)'  },
              },
              scanline: {
                '0%':   { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100vh)' },
              },
            },
          },
        },
      };
    </script>
    <style>
      body { background-color: #050508; color: #e2e8f0; font-family: 'Inter', sans-serif; }
      .glass { background: rgba(10,10,15,0.8); backdrop-filter: blur(12px); border: 1px solid rgba(26,26,46,0.8); }
      .glow-cyan    { box-shadow: 0 0 20px rgba(0,245,255,0.3);   }
      .glow-magenta { box-shadow: 0 0 20px rgba(255,0,255,0.3);   }
      .glow-purple  { box-shadow: 0 0 20px rgba(191,0,255,0.3);   }
      .glow-green   { box-shadow: 0 0 20px rgba(0,255,136,0.3);   }
      .text-glow-cyan    { text-shadow: 0 0 10px rgba(0,245,255,0.8);   }
      .text-glow-magenta { text-shadow: 0 0 10px rgba(255,0,255,0.8);   }
      .text-glow-purple  { text-shadow: 0 0 10px rgba(191,0,255,0.8);   }
      .text-glow-green   { text-shadow: 0 0 10px rgba(0,255,136,0.8);   }
      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover { transform: translateY(-4px); }
      .scanline-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,245,255,0.015) 2px, rgba(0,245,255,0.015) 4px);
        pointer-events: none; z-index: 9999;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #00f5ff40; }
    </style>
</head>
<body>
<div class="scanline-overlay"></div>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const NAV_LINKS = ['About', 'Films', 'Music', 'Magic', 'Tech', 'Contact'];

const FILMS = [
  { year: '2007', title: 'Battle in Seattle',      roles: ['Actor'],                          desc: 'Major studio feature. Protest drama starring Charlize Theron, Woody Harrelson.',         link: 'https://www.imdb.com/title/tt0850253/' },
  { year: '2010', title: 'I Am',                   roles: ['Actor'],                          desc: 'Award-winning documentary with Tom Shadyac (Ace Ventura, Bruce Almighty).',              link: 'https://www.imdb.com/title/tt1614826/' },
  { year: '2014', title: 'Deported',               roles: ['Lead Actor', 'Producer'],         desc: 'Seattle crime drama. Lead role + producer credit.',                                     link: 'https://www.imdb.com/title/tt3521058/' },
  { year: '2015', title: 'Deported 2',             roles: ['Lead Actor', 'Producer'],         desc: 'Sequel. Expanded story, same creative control.',                                        link: 'https://www.imdb.com/title/tt4985014/' },
  { year: '2018', title: 'Unsung Hero',             roles: ['Director', 'Producer', 'Actor'], desc: 'Full creative control. Directed, produced, and starred.',                               link: 'https://www.imdb.com/title/tt8105462/' },
  { year: '2022', title: 'It\'s Complicated',       roles: ['Director', 'Producer', 'Actor'], desc: 'Comedy-drama. Written, directed and produced.',                                         link: 'https://www.imdb.com/name/nm2100418/' },
  { year: '—',    title: 'Angel One Eye',          roles: ['2nd Unit / Asst. Director'],      desc: 'Behind-the-scenes leadership, bringing military precision to film production.',         link: 'https://www.imdb.com/name/nm2100418/' },

const TECH_PROJECTS = [
  { tag: 'MUSIC ADMIN',   title: 'Band Aide',        desc: 'Band management — messaging, setlists, rehearsal scheduling, and merch for independent musicians.',             link: 'https://bandaide.xyz',         color: 'neon-cyan'    },
  { tag: 'MUSIC CREATION', title: 'Hum Drumz',       desc: 'Music creation tool for beatmaking and rhythm composition. Turn ideas into tracks.',                           link: 'https://drums.xyz',            color: 'neon-magenta' },
  { tag: 'SOVEREIGN IP',  title: 'Sovranly / Pulse IP', desc: 'Blockchain-based intellectual property management. Register, protect, and trade creative IP on-chain.',      link: 'https://ipsovereignty.xyz',    color: 'neon-purple'  },
  { tag: 'MUSIC THEORY',  title: 'Fret and Theory',  desc: 'Music Theory app. Scales, chords, progressions — learn theory through your fretboard, instantly.',            link: 'https://fret.guitarigz.xyz',   color: 'neon-green'   },
  { tag: 'GUITAR FX',     title: 'Guitarigz',        desc: 'Guitar FX app — effects, tone sculpting, and signal chain tools for guitarists.',                             link: 'https://guitarigz.xyz',        color: 'neon-purple'  },
  { tag: 'AI MARKETING',  title: 'VideGrow',         desc: 'AI-powered video marketing automation. Grow your audience with intelligent content strategies.',               link: 'https://videgrow.org/',        color: 'neon-cyan'    },
];

const MUSIC_TRACKS = ['Skinwalker', 'Nhi', 'Poltergeist', 'Zombie', 'Nosferatu', 'Witch'];

// --- Components ---

function GlowOrb({ className }) {
  return <div className={`absolute rounded-full blur-3xl opacity-20 pointer-events-none ${className}`} />;
}

function Nav({ active, onNav }) {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 50);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'glass py-3' : 'py-5'}`}>
      <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <div className="font-display text-lg font-bold text-neon-cyan text-glow-cyan tracking-widest">ABLEDSOUL</div>
        <div className="hidden md:flex items-center gap-8">
          {NAV_LINKS.map(l => (
            <a key={l} href={`#${l.toLowerCase()}`}
               className={`text-sm font-medium tracking-wider transition-colors ${
                 active === l.toLowerCase() ? 'text-neon-cyan text-glow-cyan' : 'text-ash hover:text-white'
               }`}>{l}</a>
          ))}
        </div>
        <button onClick={() => setMobileOpen(!mobileOpen)} className="md:hidden text-ash hover:text-neon-cyan transition-colors">
          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            {mobileOpen
              ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />}
          </svg>
        </button>
      </div>
      {mobileOpen && (
        <div className="md:hidden glass mt-2 mx-4 rounded-lg p-4">
          {NAV_LINKS.map(l => (
            <a key={l} href={`#${l.toLowerCase()}`} onClick={() => setMobileOpen(false)}
               className="block py-2 text-sm text-ash hover:text-neon-cyan transition-colors tracking-wider">{l}</a>
          ))}
        </div>
      )}
    </nav>
  );
}

function Hero() {
  return (
    <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
      <GlowOrb className="w-96 h-96 bg-neon-cyan top-1/4 -left-20" />
      <GlowOrb className="w-80 h-80 bg-neon-magenta bottom-1/4 -right-20" />
      <GlowOrb className="w-64 h-64 bg-neon-purple top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" />
      <div className="relative z-10 text-center px-6 max-w-4xl mx-auto">
        <div className="inline-block px-4 py-1.5 mb-8 text-xs font-mono tracking-[0.3em] text-neon-cyan border border-neon-cyan/30 rounded-full bg-neon-cyan/5">
          NAVY VETERAN · FILMMAKER · METAL ARTIST · AUTHOR · WICCAN HIGH PRIEST · TECH FOUNDER
        </div>
        <h1 className="font-display text-6xl md:text-8xl font-black text-white mb-6 leading-none">
          DUANE<br />
          <span className="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan via-neon-purple to-neon-magenta text-glow-cyan">
            MARCEL
          </span>
        </h1>
        <p className="text-ash text-lg md:text-xl mb-3 max-w-2xl mx-auto leading-relaxed">
          Shadow Architect. Navy veteran turned filmmaker, extreme metal artist, and blockchain pioneer.
          Building at the intersection of art and technology.
        </p>
        <p className="font-mono text-neon-cyan/60 text-sm tracking-widest mb-12">ABLEDSOUL — FORGED IN DARKNESS</p>
        <div className="flex flex-wrap justify-center gap-4">
          <a href="#films" className="px-8 py-3 font-display text-xs tracking-widest text-dark-base bg-neon-cyan hover:bg-neon-cyan/90 rounded transition-all glow-cyan font-bold">VIEW FILMS</a>
          <a href="#tech"  className="px-8 py-3 font-display text-xs tracking-widest text-neon-cyan border border-neon-cyan/40 hover:border-neon-cyan hover:bg-neon-cyan/10 rounded transition-all">EXPLORE TECH</a>
        </div>
      </div>
      <div className="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
        <svg className="w-5 h-5 text-ash" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </section>
  );
}

function About() {
  const stats = [
    { val: '20+', label: 'Years Creating' },
    { val: 'USN', label: 'Navy Veteran' },
    { val: '∞',  label: 'Boundaries Broken' },
  ];
  return (
    <section id="about" className="py-24 px-6">
      <div className="max-w-6xl mx-auto">
        <div className="grid md:grid-cols-2 gap-16 items-center">
          <div>
            <div className="font-mono text-neon-cyan text-xs tracking-[0.3em] mb-4">// ORIGIN STORY</div>
            <h2 className="font-display text-4xl font-bold text-white mb-6 leading-tight">SHADOW<br />ARCHITECT</h2>
            <p className="text-ash leading-relaxed mb-4">United States Navy veteran. Award-winning filmmaker. Extreme metal artist. Published author. Wiccan high priest. Tech founder.</p>
            <p className="text-ash leading-relaxed mb-4">Two decades of creating across disciplines — from military service to Hollywood productions, underground metal to blockchain technology.</p>
            <p className="text-ash leading-relaxed">Every project is an act of defiance against limitation.</p>
          </div>
          <div className="grid grid-cols-3 gap-4">
            {stats.map(s => (
              <div key={s.label} className="glass rounded-xl p-6 text-center card-hover">
                <div className="font-display text-3xl font-black text-neon-cyan text-glow-cyan mb-2">{s.val}</div>
                <div className="text-ash text-xs tracking-wider">{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function Films() {
  const [active, setActive] = useState(null);
  return (
    <section id="films" className="py-24 px-6 bg-dark-panel">
      <div className="max-w-6xl mx-auto">
        <div className="font-mono text-neon-magenta text-xs tracking-[0.3em] mb-4">// FILMOGRAPHY</div>
        <h2 className="font-display text-4xl font-bold text-white mb-12">SILVER SCREEN</h2>
        <div className="space-y-3">
          {FILMS.map((f, i) => (
            <div key={i} onClick={() => setActive(active === i ? null : i)}
                 className="glass rounded-xl overflow-hidden cursor-pointer card-hover">
              <div className="flex items-center justify-between p-5">
                <div className="flex items-center gap-6">
                  <span className="font-mono text-neon-magenta/60 text-sm w-12 shrink-0">{f.year}</span>
                  <div>
                    <h3 className="text-white font-semibold">{f.title}</h3>

                        <span key={r} className="text-xs px-2 py-0.5 rounded-full border border-neon-magenta/30 text-neon-magenta/70 font-mono">{r}</span>
                      ))}
                    </div>
                  </div>
                </div>
                <svg className={`w-4 h-4 text-ash transition-transform shrink-0 ${active === i ? 'rotate-180' : ''}`}
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                </svg>
              </div>
              {active === i && (
                <div className="px-5 pb-5 flex items-center justify-between gap-4">
                  <p className="text-ash text-sm leading-relaxed">{f.desc}</p>
                  <a href={f.link} target="_blank" rel="noopener noreferrer"
                     className="shrink-0 px-4 py-2 text-xs font-mono text-neon-magenta border border-neon-magenta/40 hover:bg-neon-magenta/10 rounded transition-all">
                    IMDB →
                  </a>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

  );
}

function Music() {
  return (
    <section id="music" className="py-24 px-6">
      <div className="max-w-6xl mx-auto">
        <div className="font-mono text-neon-green text-xs tracking-[0.3em] mb-4">// DISCOGRAPHY</div>
        <h2 className="font-display text-4xl font-bold text-white mb-4">EXTREME METAL</h2>
        <p className="text-ash mb-12 max-w-xl">Forged in the underground. Extreme metal with lyrical depth spanning philosophy, mysticism, and the human condition.</p>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-12">
          {MUSIC_TRACKS.map((t, i) => (
            <div key={t} className="glass rounded-xl p-5 card-hover group">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-8 h-8 rounded-lg bg-neon-green/10 border border-neon-green/20 flex items-center justify-center">
                  <span className="font-mono text-neon-green text-xs">{String(i+1).padStart(2,'0')}</span>
                </div>
                <span className="text-white font-medium text-sm">{t}</span>
              </div>
              <div className="flex gap-1">
                {[...Array(20)].map((_,j) => (
                  <div key={j} className="flex-1 rounded-full bg-neon-green/20 group-hover:bg-neon-green/40 transition-colors"
                       style={{ height: `${8 + Math.sin(j*0.8+i)*6}px` }} />
                ))}
              </div>
            </div>
          ))}
        </div>
        <div className="glass rounded-xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div>
            <h3 className="text-white font-semibold mb-1">Stream &amp; Purchase</h3>
            <p className="text-ash text-sm">Available on all major platforms. Support independent extreme metal.</p>
          </div>
          <div className="flex gap-3">
            <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer"
               className="px-4 py-2 text-xs font-mono text-neon-green border border-neon-green/40 hover:bg-neon-green/10 rounded transition-all">
              SPOTIFY
            </a>
            <a href="https://music.apple.com" target="_blank" rel="noopener noreferrer"
               className="px-4 py-2 text-xs font-mono text-neon-green border border-neon-green/40 hover:bg-neon-green/10 rounded transition-all">
              APPLE MUSIC
            </a>
          </div>
        </div>
      </div>
    </section>
  );
}

function MagicSection() {
  const paths = [
    { title: 'High Priest',     desc: 'Ordained Wiccan High Priest. 15+ years leading ritual and ceremony.' },
    { title: 'Occult Author',   desc: 'Published works on modern Wicca, shadow work, and ceremonial practice.' },
    { title: 'Ritual Crafting', desc: 'Custom rituals, spellwork, and spiritual consulting for seekers.' },
  ];
  return (
    <section id="magic" className="py-24 px-6 bg-dark-panel">
      <div className="max-w-6xl mx-auto">
        <div className="font-mono text-neon-purple text-xs tracking-[0.3em] mb-4">// THE CRAFT</div>

        <div className="grid md:grid-cols-3 gap-6">
          {paths.map(p => (
            <div key={p.title} className="glass rounded-xl p-6 card-hover glow-purple border border-neon-purple/20">
              <div className="w-10 h-10 rounded-lg bg-neon-purple/10 border border-neon-purple/30 flex items-center justify-center mb-4">
                <span className="text-neon-purple text-xl">✦</span>

function Tech() {
  return (
    <section id="tech" className="py-24 px-6">
      <div className="max-w-6xl mx-auto">
        <div className="font-mono text-neon-cyan text-xs tracking-[0.3em] mb-4">// VENTURES</div>
        <h2 className="font-display text-4xl font-bold text-white mb-4">TECH STACK</h2>
        <p className="text-ash mb-12 max-w-xl">Building the tools that artists, musicians, and creators deserve — from IP protection to AI marketing.</p>
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
          {TECH_PROJECTS.map(p => (
            <a key={p.title} href={p.link} target="_blank" rel="noopener noreferrer"
               className="glass rounded-xl p-6 card-hover group block">
              <div className="flex items-start justify-between mb-4">

                </span>
                <svg className="w-4 h-4 text-steel group-hover:text-neon-cyan transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">

function Contact() {
  const [sent, setSent] = useState(false);
  const handleSubmit = (e) => {
    e.preventDefault();
    setSent(true);
  };
  const socials = [
    { label: 'IMDB',      href: 'https://www.imdb.com/name/nm2100418/', color: 'neon-cyan'    },
    { label: 'GitHub',   href: 'https://github.com/Drevynn',             color: 'neon-purple'  },
    { label: 'SPOTIFY',  href: 'https://open.spotify.com',               color: 'neon-green'   },
  ];
  return (
    <section id="contact" className="py-24 px-6 bg-dark-panel">
      <div className="max-w-3xl mx-auto">
        <div className="font-mono text-neon-cyan text-xs tracking-[0.3em] mb-4">// REACH OUT</div>

                <a key={s.label} href={s.href} target="_blank" rel="noopener noreferrer"

              ))}

          </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <input type="text"  required placeholder="Name"
                     className="w-full bg-dark-card border border-dark-border rounded-lg px-4 py-3 text-white placeholder-steel text-sm focus:border-neon-cyan/50 focus:outline-none transition-colors" />
              <input type="email" required placeholder="Email"
                     className="w-full bg-dark-card border border-dark-border rounded-lg px-4 py-3 text-white placeholder-steel text-sm focus:border-neon-cyan/50 focus:outline-none transition-colors" />
              <textarea required rows={4} placeholder="Message"
                        className="w-full bg-dark-card border border-dark-border rounded-lg px-4 py-3 text-white placeholder-steel text-sm focus:border-neon-cyan/50 focus:outline-none transition-colors resize-none" />

              <div className="text-center">
                <div className="text-neon-green text-4xl mb-4">✓</div>
                <p className="font-display text-neon-green tracking-wider text-sm">TRANSMISSION RECEIVED</p>
                <p className="text-ash text-xs mt-2">Will respond within 48 hours.</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </section>
  );

function App() {
  const [activeSection, setActiveSection] = useState('');
  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActiveSection(entry.target.id);
      });
    }, { threshold: 0.3 });
    NAV_LINKS.forEach(l => {
      const el = document.getElementById(l.toLowerCase());
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <div className="relative overflow-x-hidden">
      <Nav active={activeSection} />
      <Hero />
      <About />
      <Films />
      <Music />
      <MagicSection />
      <Tech />
      <Contact />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
